services:
  app:
    build: .
    env_file: .env
    environment:
      # A app fica atrás do Caddy (1 proxy)
      TRUST_PROXY: "1"
    volumes:
      - dados:/app/instance
      - fotos:/app/uploads
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # HTTPS automático (Let's Encrypt). Defina DOMINIO no .env, ex.: DOMINIO=checklist.suaempresa.com.br
  caddy:
    image: caddy:2
    command: caddy reverse-proxy --from ${DOMINIO:-localhost} --to app:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dados:
  fotos:
  caddy_data:
